server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Vite incluye un hash en estos nombres: se pueden guardar en caché sin riesgo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cualquier otra ruta la resuelve la aplicación de React.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
